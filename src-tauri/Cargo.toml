[package]
name = "tempus"
version = "0.1.0"
description = "A private, local-first screenshot timelapse recorder"
authors = ["Tempus contributors"]
edition = "2021"

[lib]
name = "tempus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
xcap = "0.9"
